name: Deploy and accept staging

on:
  workflow_run:
    workflows: ["Release gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-staging-deployment
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    name: Deploy exact main revision and accept Cloudflare staging
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          vars.CLOUDFLARE_STAGING_ENABLED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: staging
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      STAGING_ACCEPTANCE_REPORT: .cache/staging-acceptance/report.json

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Require scoped Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Install locked dependencies and build
        run: |
          npm ci
          npm run build

      - name: Apply staging D1 migrations
        run: npm run db:migrate:staging

      - name: Deploy the application Worker
        run: >-
          npm run deploy:staging --
          --message "Verified GitHub revision ${DEPLOY_SHA}"
          --tag "git-${DEPLOY_SHA:0:12}"

      - name: Deploy the processor Worker and Container
        run: >-
          npm run processor:cloud:staging --
          --message "Verified GitHub revision ${DEPLOY_SHA}"
          --tag "git-${DEPLOY_SHA:0:12}"

      - name: Run deployed Cloudflare acceptance
        id: acceptance
        run: npm run verify:staging

      - name: Upload staging acceptance evidence
        if: ${{ !cancelled() && steps.acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: staging-acceptance-${{ env.DEPLOY_SHA }}
          path: .cache/staging-acceptance/report.json
          retention-days: 30
          if-no-files-found: error
