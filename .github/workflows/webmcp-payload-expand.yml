name: Expand WebMCP challenge payload

on:
  push:
    branches:
      - webmcp-challenge
    paths:
      - ".github/webmcp-bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out challenge branch
        uses: actions/checkout@v4
        with:
          ref: webmcp-challenge
          fetch-depth: 0
          persist-credentials: true

      - name: Expand the reviewed challenge payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/webmcp-bootstrap/payload.* > /tmp/webmcp-payload.b64
          base64 --decode /tmp/webmcp-payload.b64 > /tmp/webmcp-payload.tar.xz
          tar -xJf /tmp/webmcp-payload.tar.xz -C .
          rm -rf .github/webmcp-bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No payload changes to commit."
            exit 0
          fi
          git commit -m "Add WebMCP semantic spatial browser"
          git push origin HEAD:webmcp-challenge
